<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9ecf1">
  <title>單字小劇場｜A1–A2</title>
  <style>
:root {
  color-scheme: light;
  --ink: #482439;
  --muted: #765365;
  --pink: #903557;
  --border: #ebccdb;
  --paper: #fffbfd;
  font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
  color: var(--ink);
  background: #f9ecf1;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-width: 280px;
  min-height: 100svh;
  background: radial-gradient(ellipse at 50% 46%, #fffafd 5%, #faedf3 65%, #f5e2eb 100%);
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
button:focus-visible, summary:focus-visible { outline: 3px solid #903557; outline-offset: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.topbar { position: absolute; inset: 0 0 auto; height: 64px; display: grid; place-items: center; }
.brand { color: #795265; font-size: .92rem; font-weight: 700; letter-spacing: .18em; }
.menu-button { position: absolute; top: 15px; left: max(16px, env(safe-area-inset-left)); }
.icon-button {
  display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
  color: var(--pink); background: #fff9fc; border: 1px solid var(--border); border-radius: 13px;
}
.icon-button:hover { background: #f9e7ef; border-color: #dbaec4; }
.menu-icon { display: grid; gap: 4px; }
.menu-icon i { width: 17px; height: 1.7px; background: currentColor; border-radius: 2px; }
.menu-icon i:last-child { width: 12px; }

.game { min-height: 100svh; display: grid; justify-items: center; align-items: center; padding: 76px 14px 30px; }
.game-frame { width: min(100%, 560px); }
.lesson-heading { text-align: center; margin-bottom: clamp(14px, 3.2vh, 26px); }
.theme-name { color: var(--pink); font-size: .84rem; font-weight: 750; letter-spacing: .16em; }
.lesson-heading h1 { margin: 6px 0 0; font-size: clamp(1.35rem, 4.8vw, 1.86rem); line-height: 1.3; letter-spacing: .045em; }

.card { height: clamp(424px, 62svh, 470px); perspective: 1400px; }
.card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .65s cubic-bezier(.23,.7,.24,1); }
.card.is-flipped .card-inner { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0; border: 1px solid #e5c2d2; border-radius: 28px; background: var(--paper);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 26px 60px -33px #8750668a, 0 4px 0 #eacbd9;
}
.card-front { display: flex; align-items: center; flex-direction: column; padding: 27px 20px 25px; }
.progress { display: flex; gap: 7px; }
.progress i { height: 5px; width: 17px; border-radius: 12px; background: #f0dce6; }
.progress i.past { background: #d9a4bd; }
.progress i.current { width: 29px; background: #a63f66; }
.word-content { flex: 1; display: grid; align-content: center; text-align: center; justify-items: center; width: 100%; padding: 15px 0 8px; }
.word {
  margin: 0; max-width: 100%; overflow-wrap: anywhere; color: #572239;
  font-family: Georgia, 'Times New Roman', serif; font-weight: 700;
  font-size: clamp(2.6rem, 10vw, 5rem); letter-spacing: -.045em; line-height: 1.03;
}
.word.is-long { font-size: clamp(2.1rem, 8vw, 4rem); }
.word-rule { margin: 21px 0 15px; width: 28px; height: 2px; background: #d8a1b9; border-radius: 5px; }
.meaning { color: var(--muted); margin: 0; font-size: clamp(1.14rem, 4.1vw, 1.43rem); line-height: 1.45; }
.sound-button { border-radius: 50%; }
.sound-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
.sound-button:disabled { opacity: .45; }
.word-actions { align-self: stretch; display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; margin-top: 29px; }
.word-actions .text-button { grid-column: 1; justify-self: start; }
.word-actions .action-button { grid-column: 2; justify-self: center; }
.action-button {
  min-height: 44px; padding: 9px 20px; border: 1px solid transparent; border-radius: 13px;
  background: var(--pink); color: white; font-weight: 700; white-space: nowrap;
  box-shadow: 0 4px 11px #9035572b;
}
.action-button:hover { background: #772543; }
.action-button:active { transform: translateY(1px); }
.text-button { min-height: 44px; padding: 7px 8px; border: 0; border-radius: 9px; color: var(--pink); background: transparent; font-weight: 650; white-space: nowrap; }
.text-button:hover { background: #f9eaf1; }

.card-back { transform: rotateY(180deg); overflow: hidden; }
.theatre { display: grid; grid-template-rows: minmax(0, 1fr) auto; height: 100%; }
.stage { position: relative; isolation: isolate; overflow: hidden; background: #efdfdc; --wall: #f2e3d7; --paint: #d7e6dc; --floor: #b8aeb1; --wood: #b58071; --cabinet: #fbf4e9; }
.stage[data-setting='desk'] { --wall: #f4e3d4; --paint: #efd1d5; --floor: #c7a9af; --wood: #af7179; --cabinet: #fdf1ee; }
.stage[data-setting='lab'] { --wall: #e6e9ee; --paint: #d8dee9; --floor: #a6a9bc; --wood: #81869f; --cabinet: #f6f6fb; }
.stage[data-setting='ward'] { --wall: #f2e6e9; --paint: #e0ded2; --floor: #bfb0bf; --wood: #9c777f; --cabinet: #f6edeb; }
.scenery { position: absolute; inset: 0; background: linear-gradient(var(--wall) 0 58%, var(--paint) 58% 84%, var(--floor) 84%); }
.wall-line { position: absolute; inset: 57.5% 0 auto; height: 1.25%; background: #fff9f28c; box-shadow: 0 2px 0 #82576c10; }
.window {
  position: absolute; top: 20%; left: 8%; width: 27%; height: 43%; overflow: hidden; border: 7px solid #fff7ee;
  border-radius: 45% 45% 11px 11px; background: linear-gradient(163deg, #e3edf0 0 62%, #bdcfc2 63% 81%, #9fb6aa 82%);
  box-shadow: 5px 7px 0 #8f6a5317, inset 0 0 12px #8c9f9e28;
}
.window i:first-child { position: absolute; left: 49%; top: 0; width: 5px; height: 100%; background: #fff8ef; }
.window i:last-child { position: absolute; top: 57%; width: 100%; height: 5px; background: #fff8ef; }
.picture { position: absolute; top: 23%; right: 11%; width: 11%; aspect-ratio: .85; border: 4px solid #fdf7f1; border-radius: 7px; background: #e2bdca; box-shadow: 4px 4px 0 #7953631a; }
.picture i { position: absolute; inset: 23%; background: #fff6ef; clip-path: polygon(34% 0,66% 0,66% 34%,100% 34%,100% 66%,66% 66%,66% 100%,34% 100%,34% 66%,0 66%,0 34%,34% 34%); }
.cabinet { position: absolute; bottom: 14%; right: 1%; width: 34%; height: 28%; border: 5px solid #fffaf0a8; border-radius: 6px; background: var(--cabinet); box-shadow: 5px 7px 0 #7d5d6719; }
.cabinet i { display: block; height: 50%; border-bottom: 2px solid #9d829424; }
.cabinet i::after { content: ''; display: block; margin: 7px auto 0; width: 17%; height: 3px; background: #ac929f; border-radius: 2px; }
.floor { position: absolute; left: 12%; right: 12%; bottom: 2%; height: 12%; border-radius: 50%; background: #79546a1f; filter: blur(3px); }
.table { position: absolute; z-index: 2; bottom: 0; left: 0; right: 0; height: 10%; background: var(--wood); box-shadow: inset 0 6px 0 #ffe4cf55, 0 -3px 0 #8c607433; }
.table i { display: block; margin: 5px auto 0; border-radius: 50%; width: 54%; height: 6px; background: #f7cfba4d; }
.puppets { position: absolute; z-index: 1; inset: 0; pointer-events: none; }
.puppet { position: absolute; bottom: 7%; margin: 0; width: 45%; height: 69%; transform-origin: 50% 96%; }
.puppet:first-child { left: 2.6%; }
.puppet:last-child { right: 2.6%; }
.puppet img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(5px 5px 4px #5040412d); }
.card.is-flipped .puppet.is-speaking { animation: sway 2.7s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-1.3deg); } 50% { transform: rotate(1.55deg) translateY(-2px); } }

.bubble {
  position: absolute; z-index: 3; top: 6%; left: 8%; max-width: 84%; width: max-content;
  min-width: min(72%, 200px); padding: 15px 21px 17px; border-radius: 35px 39px 32px 38px;
  color: #482737; background: #fffdf9; box-shadow: 0 5px 15px #5f455338, inset 0 -2px 0 #f0dde3;
}
.bubble[data-speaker='1'] { right: 8%; left: auto; }
.bubble::before, .bubble::after { content: ''; position: absolute; background: #fffdf9; pointer-events: none; }
.bubble::before { inset: -5px 12% auto; height: 26px; border-radius: 55% 45% 52% 48%; box-shadow: -19px 7px 0 -3px #fffdf9, 20px 9px 0 -2px #fffdf9; }
.bubble::after { left: 29%; bottom: -8px; width: 20px; height: 18px; transform: rotate(32deg); border-radius: 65% 38% 75% 35%; box-shadow: 7px 9px 0 -6px #fffdf9; }
.bubble[data-speaker='1']::after { left: auto; right: 29%; transform: scaleX(-1) rotate(32deg); }
.bubble p { position: relative; margin: 0; line-height: 1.37; }
.bubble p[lang='en'] { font-size: clamp(1.08rem, 4.7vw, 1.48rem); font-weight: 650; }
.bubble mark { color: #912b52; background: transparent; font-weight: 800; }
.bubble .translation { margin-top: 6px; color: #78556a; font-size: .89rem; }
.bubble.pop { animation: pop .23s ease-out both; }
@keyframes pop { from { opacity: .3; transform: translateY(5px) scale(.98); } to { opacity: 1; transform: none; } }
.scene-controls { display: flex; justify-content: space-between; align-items: center; padding: 13px clamp(12px, 3.6vw, 24px); background: var(--paper); }
.scene-tools { display: flex; align-items: center; gap: 8px; }
.translation-button { font-weight: 750; border-radius: 50%; }
.translation-button[aria-pressed='true'] { background: #f5dce8; }

.question-panel { height: 100%; overflow: auto; display: flex; flex-direction: column; justify-content: center; gap: 13px; padding: 24px clamp(16px, 5vw, 50px); }
.question-panel h2 { margin: 0 0 5px; font-size: clamp(1.13rem, 4.6vw, 1.43rem); text-align: center; line-height: 1.45; }
.choices { display: grid; gap: 8px; }
.choice { min-height: 46px; padding: 10px 14px; background: #fff6fb; border: 1px solid #ead0dd; border-radius: 12px; text-align: center; font-weight: 650; }
.choice:hover:not(:disabled) { background: #f6e1eb; }
.choice.is-incorrect { color: #8b3c50; border-color: #d794a5; background: #fce8ee; }
.choice.is-correct { color: #315f4e; border-color: #a7cfb7; background: #e8f5ed; }
.feedback { min-height: 1.4em; margin: 0; text-align: center; font-weight: 650; color: var(--pink); }
.feedback.success { color: #315f4e; }
.question-actions { display: flex; justify-content: space-between; gap: 8px; }

.menu {
  position: fixed; inset: max(14px, env(safe-area-inset-top)) auto auto max(14px, env(safe-area-inset-left)); margin: 0;
  width: min(350px, calc(100% - 28px)); max-height: calc(100svh - 28px); padding: 0 15px 15px;
  color: var(--ink); background: #fffafd; border: 1px solid #e7c5d5; border-radius: 20px;
  box-shadow: 0 22px 55px -15px #502a4266; overscroll-behavior: contain;
}
.menu::backdrop { background: #4a293e25; }
.menu-heading { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; background: #fffafd; }
.menu-heading h2 { margin: 0 0 0 5px; font-size: 1.05rem; }
.close-button { font-size: 1.5rem; }
.menu-section { border-top: 1px solid #efdae4; }
.menu-section summary { cursor: pointer; min-height: 44px; padding: 12px 4px; color: #71354f; font-weight: 700; }
.menu-count { float: right; font-size: .86rem; color: var(--muted); }
.lesson-list { display: grid; padding-bottom: 9px; }
.lesson-link { display: flex; align-items: center; gap: 10px; padding: 10px 8px; min-height: 42px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
.lesson-link:hover, .lesson-link[aria-current='true'] { background: #f8e5ee; }
.lesson-number { width: 2ch; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.lesson-state { margin-left: auto; color: #3b7059; font-size: .83rem; }
.topic-list { display: grid; gap: 10px; margin: 0; padding: 0 4px 8px; list-style: none; color: var(--muted); }
.topic-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topic-list small { font-size: .8rem; }

.menu-tile { margin: 0 0 8px; padding: 0 10px; border: 1px solid #e7c5d5; border-radius: 11px; background: #fff4f9; }
.menu-tile summary { min-height: 44px; padding: 12px 0; font-weight: 750; color: #71354f; cursor: pointer; }
.menu-link { display: flex; align-items: center; min-height: 44px; margin: 0 0 7px; padding: 8px 10px; border-radius: 8px; color: #78334f; background: #fffafd; font-weight: 700; text-decoration: none; }
.menu-link:hover { background: #f8e4ef; }
.menu-link:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.save-buttons { display: flex; gap: 5px 12px; flex-wrap: wrap; }
.save-status { margin: 3px 0 9px; color: var(--muted); font-size: .9rem; }
.save-status:empty { display: none; }
.menu-tile .action-button { margin-bottom: 9px; }
.menu-count { margin-left: 6px; }

.stage[data-theme='home'] { --wall: #f1dfef; --paint: #e9cbd9; --floor: #c1a1ad; --wood: #a27483; }
.stage[data-theme='food'] { --wall: #f7dfc6; --paint: #f0cac1; --floor: #c3a09b; --wood: #a86969; }
.stage[data-theme='shop'] { --wall: #eee2f4; --paint: #dacdeb; --floor: #b3a4bd; --wood: #866c9e; }
.stage[data-theme='transit'] { --wall: #d8ecf3; --paint: #c7dce4; --floor: #9fadb9; --wood: #667f95; }
.stage[data-theme='travel'] { --wall: #f3e5cf; --paint: #edd8c0; --floor: #bea7a3; --wood: #a47772; }
.stage:is([data-setting='yard'],[data-setting='patio'],[data-setting='bike'],[data-setting='sights'],[data-setting='mountain']) { --wall: #d8eef0; --paint: #cfdfbd; --floor: #9eae8a; --wood: #7b9571; }
.stage:is([data-setting='beach'],[data-setting='pier']) { --wall: #dbf0f1; --paint: #9dd7d9; --floor: #e2bd98; --wood: #bf977b; }
.stage:is([data-setting='street'],[data-setting='bus'],[data-setting='taxi']) { --wall: #d8e7ee; --paint: #bbceda; --floor: #8d9cac; --wood: #627488; }
.stage:is([data-setting='airport'],[data-setting='gate']) { --wall: #daeaf1; --paint: #bed4e5; --floor: #9facc5; --wood: #657d9d; }
.stage:is([data-setting='bedroom'],[data-setting='hotel']) { --wall: #f3e0dc; --paint: #f0cdd3; --floor: #b8a1ad; --wood: #946f7e; }
.stage:is([data-setting='laundry'],[data-setting='bath'],[data-setting='kitchen'],[data-setting='kitchen-food']) { --wall: #edf0e2; --paint: #cedfce; --floor: #a0bab0; --wood: #77958a; }

.set-piece { position: absolute; right: 6%; bottom: 16%; width: 27%; height: 34%; border-radius: 8px; }
.stage[data-theme]:not([data-theme='medical']) .picture { display: none; }
.stage[data-theme]:not([data-theme='medical']) .cabinet { opacity: .67; }
.stage:is([data-setting='entry'],[data-setting='fitting'],[data-setting='hotel']) .set-piece { height: 63%; right: 13%; width: 21%; border: 5px solid #fff9e9ba; background: linear-gradient(90deg,#a87f8870,#c6a5b1); border-radius: 43% 43% 4px 4px; box-shadow: 5px 6px 0 #7153672b; }
.stage[data-setting='entry'] .set-piece::after { content: ''; position: absolute; width: 10px; height: 10px; right: 11%; top: 57%; background: #e6b85a; border-radius: 50%; }
.stage[data-setting='living'] .set-piece { right: 5%; width: 35%; border: 7px solid #eddbe6; height: 29%; background: #ca9db7; box-shadow: inset 0 -12px #af859f; border-radius: 16px 16px 7px 7px; }
.stage:is([data-setting='bedroom'],[data-setting='ward']) .set-piece { width: 36%; background: linear-gradient(155deg,#fff6f387 0 27%,#d9a7b5 28% 85%,#a98591 86%); border: 4px solid #fffdf78a; box-shadow: 0 9px 0 #a17d8c52; border-radius: 18px 18px 4px 4px; }
.stage:is([data-setting='laundry'],[data-setting='bath']) .set-piece { background: #fff8ee; border: 5px solid #a6bfb9; }
.stage[data-setting='laundry'] .set-piece::after { content: ''; position: absolute; inset: 23% 23% 12%; border-radius: 50%; border: 5px solid #a9bdc4; background: linear-gradient(145deg,#def4f2,#8dbbbb); }
.stage:is([data-setting='shop'],[data-setting='grocery'],[data-setting='checkout'],[data-setting='study'],[data-setting='kitchen'],[data-setting='kitchen-food']) .set-piece {
  height: 45%; background: repeating-linear-gradient(0deg,#ad7f7655 0 5px,#fff6eeb8 5px 31%);
  border: 5px solid #fff8ee; box-shadow: 5px 7px 0 #6f5c6b24;
}
.stage:is([data-setting='dining'],[data-setting='cafe'],[data-setting='hotel-food'],[data-setting='patio']) .set-piece {
  width: 40%; height: 19%; border-radius: 50% 50% 4px 4px; background: #f4c79c;
  box-shadow: 0 10px 0 #9362587a, inset 0 5px 0 #fde2bd;
}
.stage:is([data-setting='station'],[data-setting='train'],[data-setting='metro'],[data-setting='bus'],[data-setting='taxi'],[data-setting='airport'],[data-setting='gate']) .set-piece {
  right: 4%; width: 61%; height: 44%; border: 5px solid #e5f1f8; border-radius: 19px 19px 6px 6px;
  background: repeating-linear-gradient(90deg,#b4d2e3 0 22%,#e5f1f8 22% 25%);
  box-shadow: inset 0 -15px 0 #809cb3, 5px 7px 0 #626b8129;
}
.stage:is([data-setting='bus'],[data-setting='taxi']) .set-piece { border-color: #efc681; box-shadow: inset 0 -15px 0 #dfa766, 5px 7px 0 #626b8129; }
.stage:is([data-setting='street'],[data-setting='sights'],[data-setting='museum']) .set-piece {
  height: 62%; width: 38%; background: repeating-linear-gradient(90deg,#c0cbd5 0 13%,#d4e0e7 13% 23%);
  clip-path: polygon(0 100%,0 32%,21% 32%,21% 13%,49% 13%,49% 46%,68% 46%,68% 0,100% 0,100% 100%);
}
.stage:is([data-setting='yard'],[data-setting='bike'],[data-setting='mountain']) .set-piece {
  height: 67%; width: 70%; right: 0; background: linear-gradient(#bacfa5,#79976e);
  clip-path: polygon(0 92%,17% 56%,28% 71%,52% 14%,64% 38%,77% 24%,100% 85%,100% 100%,0 100%);
}
.stage:is([data-setting='beach'],[data-setting='pier']) .set-piece { height: 21%; width: 68%; right: -6%; bottom: 21%; background: #75b7be; border-top: 6px solid #f4fdedb0; border-radius: 48% 0 0 14%; }
.stage:is([data-setting='yard'],[data-setting='patio'],[data-setting='street'],[data-setting='sights'],[data-setting='bike'],[data-setting='beach'],[data-setting='pier'],[data-setting='mountain']) :is(.window,.cabinet) { display: none; }
.stage[data-setting='street'] .wall-line { box-shadow: 0 2px #5a718f24, 0 86px 0 #f3f0dc9e; }
.stage-props { position: absolute; z-index: 2; left: 50%; bottom: 10.5%; display: flex; align-items: flex-end; gap: 4px; transform: translateX(-50%); white-space: nowrap; pointer-events: none; }
.stage-props span { display: block; font-size: clamp(1.15rem, 4.8vw, 2rem); filter: drop-shadow(2px 4px 2px #36274337); animation: prop-in .22s ease-out both; }
.stage-props[data-step='second'] span:first-child { opacity: .76; animation: none; }
.stage[data-theme='food'] .puppet:last-child img { transform: scaleX(-1); }
@keyframes prop-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.split-set, .actor-phone { display: none; }
.stage[data-call='true'] .split-set { display: block; position: absolute; inset: 0; z-index: 2; background: linear-gradient(106deg,#7889ac50 0 49.5%,#fff6efe0 49.5% 50.5%,transparent 50.5%); }
.stage[data-call='true'] .split-set::before { content: ''; position: absolute; top: 29%; left: 5%; width: 38%; height: 31%; border: 6px solid #eef1f2b8; border-radius: 13px 13px 5px 5px; background: linear-gradient(160deg,#bad7e9 62%,#98b3b1 63%); box-shadow: 4px 6px 0 #5e718736; }
.stage[data-call='true'][data-theme='home'] .split-set::before { background: repeating-linear-gradient(90deg,#b4d2e3 0 44%,#e5f1f8 44% 53%); border-color: #eacf9c; box-shadow: 0 12px 0 #cf9b7b; }
.stage[data-call='true'] .window { left: auto; right: 7%; width: 21%; }
.stage[data-call='true'] .set-piece { max-width: 37%; }
.stage[data-call='true'] .actor-phone {
  display: block; position: absolute; z-index: 1; width: clamp(12px, 3.8vw, 22px); height: clamp(20px, 6.5vw, 36px);
  top: 41%; left: 28%; border: 2px solid #312e4a; border-radius: 5px;
  transform: rotate(-15deg); background: linear-gradient(150deg,#7ea1bc 10%,#424663 70%);
  box-shadow: 1px 3px 3px #44365050;
}
.stage[data-call='true'] .puppet:last-child .actor-phone { left: auto; right: 28%; transform: rotate(15deg); }
.stage[data-call='true'] .actor-phone::after { content: ''; position: absolute; inset: auto 25% 2px; height: 2px; border-radius: 3px; background: #c3d5e4; }
.stage[data-call='true'] .puppets { z-index: 2; }
.stage[data-call='true'] .stage-props { gap: 10px; }

@media (min-height: 740px) {
  .game { padding: 66px 14px; }
  .game-frame { position: relative; }
  .lesson-heading { position: absolute; bottom: 100%; right: 0; left: 0; }
}

function makeLessons(roles, source) {
  return source.trim().split('\n').map((record, index) => {
    const [title, setting, vocabulary, objects, script, question, answers] = record.split('|');
    const words = vocabulary.split(';').map((entry) => {
      const [spelling, definition] = entry.split('=');
      const [word, ...forms] = spelling.split('/');
      return [word, definition, forms];
    });
    const lines = script.split('~').map((dialogue, turn) => [turn % 2, ...dialogue.split('=')]);
    const options = answers.split(';');
    const correct = index % options.length;
    options.splice(correct, 0, ...options.splice(0, 1));
    return { title, setting, roles, words, props: objects.split(';'), lines, question, options, correct };
  });
}

const storageKey = 'little-word-theatre:a1-a2:v2';
const oldStorageKey = 'little-word-theatre:medical:v1';
const saveType = 'little-word-theatre';
const phases = ['words', 'scene', 'question'];

function newCheckpoint() {
  return { phase: 'words', word: 0, line: 0, answer: null };
}

function validIndex(value, length) {
  return Number.isInteger(value) && value >= 0 && value < length;
}

function cleanTopicProgress(source, topic) {
  const rawCompleted = Array.isArray(source?.completed) ? source.completed : [];
  const completed = new Set(rawCompleted.filter((index) => validIndex(index, topic.lessons.length)));
  const checkpoints = topic.lessons.map((lesson, index) => {
    const point = source?.checkpoints?.[index];
    if (!point || !phases.includes(point.phase)) return newCheckpoint();
    const answer = point.phase === 'question' && point.answer === lesson.correct ? point.answer : null;
    if (answer !== null) completed.add(index);
    return {
      phase: point.phase,
      word: validIndex(point.word, lesson.words.length) ? point.word : 0,
      line: validIndex(point.line, lesson.lines.length) ? point.line : 0,
      answer
    };
  });
  return {
    lesson: validIndex(source?.lesson, topic.lessons.length) ? source.lesson : 0,
    checkpoints,
    completed: [...completed].sort((a, b) => a - b)
  };
}

function newProgress(catalog, source = {}) {
  const topicId = catalog.some((item) => item.id === source.topic) ? source.topic : catalog[0].id;
  return {
    game: saveType,
    version: 2,
    topic: topicId,
    progress: Object.fromEntries(catalog.map((topic) => [topic.id, cleanTopicProgress(source.progress?.[topic.id], topic)]))
  };
}

function validateProgress(source, catalog) {
  if (!source || source.game !== saveType || source.version !== 2 || !source.progress) return null;
  const active = catalog.find((topic) => topic.id === source.topic);
  if (!active) return null;
  const selected = source.progress[active.id];
  if (!selected || !validIndex(selected.lesson, active.lessons.length)) return null;
  for (const topic of catalog) {
    const item = source.progress[topic.id];
    if (item === undefined && topic.id !== active.id) continue;
    if (!item || !validIndex(item.lesson, topic.lessons.length) || !Array.isArray(item.completed) ||
        !item.completed.every((index) => validIndex(index, topic.lessons.length)) ||
        !Array.isArray(item.checkpoints) || item.checkpoints.length !== topic.lessons.length) return null;
    for (let index = 0; index < item.checkpoints.length; index++) {
      const point = item.checkpoints[index];
      const lesson = topic.lessons[index];
      if (!point || !phases.includes(point.phase) || !validIndex(point.word, lesson.words.length) ||
          !validIndex(point.line, lesson.lines.length) ||
          (point.answer !== null && (point.phase !== 'question' || point.answer !== lesson.correct))) return null;
    }
  }
  return newProgress(catalog, source);
}

function loadProgress(catalog) {
  try {
    const current = JSON.parse(localStorage.getItem(storageKey));
    const restored = validateProgress(current, catalog);
    if (restored) return restored;
    const old = JSON.parse(localStorage.getItem(oldStorageKey));
    if (old && typeof old === 'object') return newProgress(catalog, { topic: 'medical', progress: { medical: old } });
  } catch {
    // A missing or invalid save leaves the game playable.
  }
  return newProgress(catalog);
}

function checkpointRank(point) {
  if (point.phase === 'question') return point.answer === null ? 200 : 201;
  if (point.phase === 'scene') return 100 + point.line;
  return point.word;
}

function mergeProgress(existing, incoming, catalog) {
  const result = newProgress(catalog, existing);
  result.topic = incoming.topic;
  for (const topic of catalog) {
    const previous = result.progress[topic.id];
    const imported = incoming.progress[topic.id];
    const active = topic.id === incoming.topic;
    previous.completed = [...new Set([...previous.completed, ...imported.completed])].sort((a, b) => a - b);
    previous.checkpoints = previous.checkpoints.map((point, index) => {
      const fromFile = imported.checkpoints[index];
      return (active && index === imported.lesson) || checkpointRank(fromFile) > checkpointRank(point) ? fromFile : point;
    });
    if (active) previous.lesson = imported.lesson;
  }
  return result;
}


'use strict';

const byId = (id) => document.getElementById(id);
const elements = Object.fromEntries([
  'menuButton', 'menu', 'closeMenu', 'lessonList', 'topicList', 'exportSave', 'chooseSave', 'saveFile', 'saveStatus', 'applySave',
  'themeName', 'lessonTitle', 'card', 'front', 'back', 'progress', 'word', 'meaning', 'wordAudio',
  'previousWord', 'nextWord', 'theatre', 'stage', 'visitor', 'clinician', 'bubble',
  'leftActor', 'rightActor', 'stageProps', 'speaker', 'line', 'translation', 'lineAudio', 'translationToggle', 'nextLine',
  'questionPanel', 'question', 'choices', 'feedback', 'replay', 'nextLesson'
].map((id) => [id, byId(id)]));

const speechAvailable = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const wordForms = {
  sneeze: ['sneezing'], hurt: ['hurts'], twist: ['twisted'], bleed: ['bleeding'],
  allergy: ['allergies'], instruction: ['instructions'], bone: ['bones'],
  symptom: ['symptoms'], change: ['changes']
};

const catalog = buildCatalog();
let saved = loadProgress(catalog);
let lessonIndex = saved.progress[saved.topic].lesson;
let showTranslation = false;
let wrongAnswer = null;
let pendingImport = null;
let importRequest = 0;

function currentTopic() { return catalog.find((topic) => topic.id === saved.topic); }
function currentProgress() { return saved.progress[saved.topic]; }
function currentLesson() { return currentTopic().lessons[lessonIndex]; }
function currentCheckpoint() { return currentProgress().checkpoints[lessonIndex]; }

function saveProgress() {
  currentProgress().lesson = lessonIndex;
  try {
    localStorage.setItem(storageKey, JSON.stringify(saved));
  } catch {
    // The lesson remains playable if storage is unavailable.
  }
}

function stopSpeech() {
  if (speechAvailable) window.speechSynthesis.cancel();
}

function speak(text) {
  if (!speechAvailable) return;
  stopSpeech();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = .84;
  window.speechSynthesis.speak(utterance);
}

function renderWord() {
  const lesson = currentLesson();
  const position = currentCheckpoint().word;
  const [word, meaning] = lesson.words[position];
  elements.word.textContent = word;
  elements.word.classList.toggle('is-long', word.length > 11);
  elements.meaning.textContent = meaning;
  elements.previousWord.hidden = position === 0;
  elements.nextWord.textContent = position === lesson.words.length - 1 ? '看小劇場' : '下一張';
  elements.progress.setAttribute('aria-valuenow', position + 1);
  elements.progress.setAttribute('aria-valuetext', '第 ' + (position + 1) + ' 張，共 ' + lesson.words.length + ' 張');
  elements.progress.replaceChildren(...lesson.words.map((_, index) => {
    const dot = document.createElement('i');
    dot.setAttribute('aria-hidden', 'true');
    if (index < position) dot.className = 'past';
    if (index === position) dot.className = 'current';
    return dot;
  }));
}

function highlightWords(text, words) {
  const forms = words.flatMap(([word, , variants]) => [word, ...(variants || wordForms[word] || [])]);
  const terms = new Set(forms.map((word) => word.toLowerCase()));
  const pattern = new RegExp('\\b(' + forms.sort((a, b) => b.length - a.length).join('|') + ')\\b', 'gi');
  const content = document.createDocumentFragment();
  for (const part of text.split(pattern)) {
    if (terms.has(part.toLowerCase())) {
      const mark = document.createElement('mark');
      mark.textContent = part;
      content.append(mark);
    } else {
      content.append(part);
    }
  }
  return content;
}

function renderScene() {
  const topic = currentTopic();
  const lesson = currentLesson();
  const position = currentCheckpoint().line;
  const [speaker, line, translation] = lesson.lines[position];
  const call = lesson.setting.startsWith('call-');
  elements.stage.dataset.theme = topic.id;
  elements.stage.dataset.setting = call ? lesson.setting.slice(5) : lesson.setting;
  elements.stage.dataset.call = String(call);
  const [left, right] = topic.portraits;
  if (elements.leftActor.getAttribute('src') !== left) elements.leftActor.setAttribute('src', left);
  if (elements.rightActor.getAttribute('src') !== right) elements.rightActor.setAttribute('src', right);
  const props = lesson.props.slice(0, position === 0 ? 1 : lesson.props.length);
  elements.stageProps.dataset.step = props.length > 1 ? 'second' : 'first';
  const propKey = topic.id + ':' + lessonIndex + ':' + props.length;
  if (elements.stageProps.dataset.key !== propKey) {
    elements.stageProps.dataset.key = propKey;
    elements.stageProps.replaceChildren(...props.map((symbol) => {
      const object = document.createElement('span');
      object.textContent = symbol;
      return object;
    }));
  }
  elements.visitor.classList.toggle('is-speaking', speaker === 0);
  elements.clinician.classList.toggle('is-speaking', speaker === 1);
  elements.bubble.dataset.speaker = speaker;
  elements.speaker.textContent = lesson.roles[speaker] + '。';
  elements.line.replaceChildren(highlightWords(line, lesson.words));
  elements.translation.textContent = translation;
  elements.translation.hidden = !showTranslation;
  elements.translationToggle.setAttribute('aria-pressed', String(showTranslation));
  elements.nextLine.textContent = position === lesson.lines.length - 1 ? '開始作答' : '下一句';
  elements.bubble.classList.remove('pop');
  void elements.bubble.offsetWidth;
  elements.bubble.classList.add('pop');
}

function renderAnswer() {
  const lesson = currentLesson();
  const answered = currentCheckpoint().answer === lesson.correct;
  Array.from(elements.choices.children, (button, index) => {
    button.classList.toggle('is-correct', answered && index === lesson.correct);
    button.classList.toggle('is-incorrect', !answered && index === wrongAnswer);
    button.disabled = answered;
  });
  elements.feedback.textContent = answered ? '答對了！' : wrongAnswer === null ? '' : '再試一次';
  elements.feedback.classList.toggle('success', answered);
  elements.nextLesson.hidden = !answered;
  elements.nextLesson.textContent = lessonIndex < currentTopic().lessons.length - 1 ? '下一單元' : '回到單元選單';
}

function renderQuestion() {
  const lesson = currentLesson();
  elements.question.textContent = lesson.question;
  elements.choices.replaceChildren(...lesson.options.map((option, index) => {
    const button = document.createElement('button');
    button.className = 'choice';
    button.type = 'button';
    if (/^[a-z]/i.test(option)) button.lang = 'en';
    button.textContent = option;
    button.addEventListener('click', () => answerQuestion(index));
    return button;
  }));
  renderAnswer();
}

function answerQuestion(index) {
  if (currentCheckpoint().answer !== null) return;
  if (index === currentLesson().correct) {
    currentCheckpoint().answer = index;
    const completed = currentProgress().completed;
    if (!completed.includes(lessonIndex)) completed.push(lessonIndex);
    wrongAnswer = null;
    saveProgress();
    renderAnswer();
    elements.nextLesson.focus({ preventScroll: true });
  } else {
    wrongAnswer = index;
    renderAnswer();
  }
}

function render() {
  const phase = currentCheckpoint().phase;
  const flipped = phase !== 'words';
  elements.themeName.textContent = currentTopic().label + ' · A1–A2';
  elements.lessonTitle.textContent = currentLesson().title;
  elements.card.classList.toggle('is-flipped', flipped);
  elements.front.inert = flipped;
  elements.back.inert = !flipped;
  elements.front.setAttribute('aria-hidden', String(flipped));
  elements.back.setAttribute('aria-hidden', String(!flipped));
  elements.theatre.hidden = phase === 'question';
  elements.questionPanel.hidden = phase !== 'question';
  if (phase === 'words') renderWord();
  if (phase === 'scene') renderScene();
  if (phase === 'question') renderQuestion();
}

function advance(focusTarget) {
  stopSpeech();
  render();
  saveProgress();
  if (focusTarget) focusTarget.focus({ preventScroll: true });
}

function showCurrentLesson() {
  wrongAnswer = null;
  showTranslation = false;
  if (elements.menu.open) elements.menu.close();
  const phase = currentCheckpoint().phase;
  const focusTarget = phase === 'words' ? elements.nextWord : phase === 'scene' ? elements.nextLine : null;
  advance(focusTarget);
  if (phase === 'question') {
    const control = currentCheckpoint().answer === null ? elements.choices.firstElementChild : elements.nextLesson;
    control?.focus({ preventScroll: true });
  }
}

function chooseLesson(index, topicId = saved.topic) {
  saved.topic = topicId;
  lessonIndex = index;
  if (currentCheckpoint().answer !== null) currentProgress().checkpoints[index] = newCheckpoint();
  showCurrentLesson();
}

function topicMenu(topic) {
  const details = document.createElement('details');
  details.className = 'menu-section';
  details.name = 'lesson-topics';
  details.open = topic.id === saved.topic;
  const progress = saved.progress[topic.id];
  const summary = document.createElement('summary');
  const count = document.createElement('span');
  count.className = 'menu-count';
  count.textContent = progress.completed.length + ' / ' + topic.lessons.length;
  summary.append(topic.label, count);
  const list = document.createElement('div');
  list.className = 'lesson-list';
  list.replaceChildren(...topic.lessons.map((lesson, index) => {
    const button = document.createElement('button');
    button.className = 'lesson-link';
    button.type = 'button';
    if (topic.id === saved.topic && index === lessonIndex) button.setAttribute('aria-current', 'true');
    const number = document.createElement('span');
    number.className = 'lesson-number';
    number.textContent = index + 1;
    const name = document.createElement('span');
    name.textContent = lesson.title;
    button.append(number, name);
    if (progress.completed.includes(index)) {
      const state = document.createElement('span');
      state.className = 'lesson-state';
      state.textContent = '已完成';
      button.append(state);
    }
    button.addEventListener('click', () => chooseLesson(index, topic.id));
    return button;
  }));
  details.append(summary, list);
  return details;
}

function openMenu() {
  elements.lessonList.replaceChildren(...catalog.map(topicMenu));
  elements.menu.showModal();
  elements.menu.scrollTop = 0;
  elements.closeMenu.focus();
}

const openTopics = new Set(catalog.map((topic) => topic.label));
elements.topicList.replaceChildren(...topics.filter((topic) => !openTopics.has(topic)).map((topic) => {
  const item = document.createElement('li');
  const status = document.createElement('small');
  status.textContent = '規劃中';
  item.append(topic, status);
  return item;
}));

elements.wordAudio.disabled = !speechAvailable;
elements.lineAudio.disabled = !speechAvailable;
elements.wordAudio.addEventListener('click', () => speak(currentLesson().words[currentCheckpoint().word][0]));
elements.lineAudio.addEventListener('click', () => speak(currentLesson().lines[currentCheckpoint().line][1]));
elements.menuButton.addEventListener('click', openMenu);
elements.closeMenu.addEventListener('click', () => elements.menu.close());
elements.menu.addEventListener('click', (event) => {
  if (event.target !== elements.menu) return;
  const rect = elements.menu.getBoundingClientRect();
  if (event.clientX < rect.left || event.clientX > rect.right ||
      event.clientY < rect.top || event.clientY > rect.bottom) elements.menu.close();
});

elements.previousWord.addEventListener('click', () => {
  currentCheckpoint().word -= 1;
  advance(currentCheckpoint().word === 0 ? elements.nextWord : null);
});

elements.nextWord.addEventListener('click', () => {
  const checkpoint = currentCheckpoint();
  if (checkpoint.word < currentLesson().words.length - 1) {
    checkpoint.word += 1;
    advance();
  } else {
    checkpoint.phase = 'scene';
    checkpoint.line = 0;
    advance(elements.nextLine);
  }
});

elements.translationToggle.addEventListener('click', () => {
  showTranslation = !showTranslation;
  elements.translation.hidden = !showTranslation;
  elements.translationToggle.setAttribute('aria-pressed', String(showTranslation));
});

elements.nextLine.addEventListener('click', () => {
  const checkpoint = currentCheckpoint();
  if (checkpoint.line < currentLesson().lines.length - 1) {
    checkpoint.line += 1;
    advance();
  } else {
    checkpoint.phase = 'question';
    advance();
    elements.choices.firstElementChild?.focus({ preventScroll: true });
  }
});

elements.replay.addEventListener('click', () => {
  const checkpoint = currentCheckpoint();
  Object.assign(checkpoint, { phase: 'scene', line: 0, answer: null });
  wrongAnswer = null;
  advance(elements.nextLine);
});

elements.nextLesson.addEventListener('click', () => {
  if (lessonIndex < currentTopic().lessons.length - 1) chooseLesson(lessonIndex + 1);
  else openMenu();
});

elements.exportSave.addEventListener('click', () => {
  saveProgress();
  const file = new Blob([JSON.stringify(saved, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(file);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'little-word-theatre-save-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  if (!pendingImport) elements.saveStatus.textContent = '已準備下載存檔。';
});

elements.chooseSave.addEventListener('click', () => elements.saveFile.click());

elements.saveFile.addEventListener('change', async () => {
  const file = elements.saveFile.files[0];
  elements.saveFile.value = '';
  if (!file) return;
  const request = ++importRequest;
  pendingImport = null;
  elements.applySave.hidden = true;
  try {
    const restored = file.size <= 500000 ? validateProgress(JSON.parse(await file.text()), catalog) : null;
    if (request !== importRequest) return;
    if (!restored) throw new Error('Invalid save');
    pendingImport = restored;
    const topic = catalog.find((item) => item.id === restored.topic);
    const point = restored.progress[topic.id];
    elements.saveStatus.textContent = topic.label + ' · ' + topic.lessons[point.lesson].title;
    elements.applySave.hidden = false;
  } catch {
    if (request === importRequest) elements.saveStatus.textContent = '這個檔案無法讀取。請選擇單字小劇場的 JSON 存檔。';
  }
});

elements.applySave.addEventListener('click', () => {
  if (!pendingImport) return;
  saved = mergeProgress(saved, pendingImport, catalog);
  pendingImport = null;
  lessonIndex = currentProgress().lesson;
  elements.applySave.hidden = true;
  elements.saveStatus.textContent = '已讀取存檔。';
  showCurrentLesson();
});

render();

</script>
</body>
</html>
